<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexus OS</title>
<meta name="theme-color" content="#0a0b0f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="2.2"/><circle cx="4.5" cy="6" r="1.6"/><circle cx="19.5" cy="6" r="1.6"/><circle cx="4.5" cy="18" r="1.6"/><circle cx="19.5" cy="18" r="1.6"/>
        <path d="M10.3 10.8 5.8 7.2M13.7 10.8l4.5-3.6M10.3 13.2 5.8 16.8M13.7 13.2l4.5 3.6"/>
      </svg>
    </div>
    <div class="login-title">Nexus OS</div>
    <div class="login-sub">Tu centro de control personal</div>

    <form id="login-form">
      <div class="login-field">
        <label for="login-user">Usuario</label>
        <input type="text" id="login-user" placeholder="Usuario" autocomplete="username">
      </div>
      <div class="login-field">
        <label for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" placeholder="••••••" autocomplete="current-password">
      </div>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn primary btn-block">Entrar</button>
    </form>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div class="app-shell" id="app-shell" style="display:none">
  <nav class="sidebar">
    <div class="nexus-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="2.2"/><circle cx="4.5" cy="6" r="1.6"/><circle cx="19.5" cy="6" r="1.6"/><circle cx="4.5" cy="18" r="1.6"/><circle cx="19.5" cy="18" r="1.6"/>
        <path d="M10.3 10.8 5.8 7.2M13.7 10.8l4.5-3.6M10.3 13.2 5.8 16.8M13.7 13.2l4.5 3.6"/>
      </svg>
    </div>
    <div class="nav-list">
      <div class="nav-item" data-route="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg>
        <span class="nav-tooltip">Home</span><span class="nav-label">Home</span>
      </div>
      <div class="nav-item" data-route="trabajo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v12H4z"/><path d="M9 7V5a3 3 0 0 1 3-3h0a3 3 0 0 1 3 3v2"/></svg>
        <span class="nav-tooltip">Trabajo</span><span class="nav-label">Trabajo</span>
      </div>
      <div class="nav-item" data-route="finanzas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1.4 1.3-2.5 3-2.5s3 1 3 2.5-1.3 2-3 2.5-3 1-3 2.5 1.3 2.5 3 2.5 3-1.1 3-2.5"/></svg>
        <span class="nav-tooltip">Finanzas</span><span class="nav-label">Finanzas</span>
      </div>
      <div class="nav-item" data-route="personal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span class="nav-tooltip">Personal</span><span class="nav-label">Personal</span>
      </div>
      <div class="nav-item" data-route="productividad">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span class="nav-tooltip">Productividad</span><span class="nav-label">Enfoque</span>
      </div>
      <div class="nav-item" data-route="conocimiento">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span class="nav-tooltip">Conocimiento</span><span class="nav-label">Saber</span>
      </div>
      <div class="nav-item" data-route="ia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.6 3.2 1.2 4.7 2.3 6.3C15.7 10.6 17.4 11.3 21 12c-3.6.7-5.3 1.4-6.7 2.7C13.2 16.3 12.6 17.8 12 21c-.6-3.2-1.2-4.7-2.3-6.3C8.4 13.4 6.7 12.7 3 12c3.7-.7 5.4-1.4 6.7-2.7C10.8 7.7 11.4 6.2 12 3z"/><path d="M19 3.5c.2 1 .4 1.5.7 1.9.4.4.9.6 1.8.8-.9.2-1.4.4-1.8.8-.3.4-.5.9-.7 1.9-.2-1-.4-1.5-.7-1.9-.4-.4-.9-.6-1.8-.8.9-.2 1.4-.4 1.8-.8.3-.4.5-.9.7-1.9z"/></svg>
        <span class="nav-tooltip">Asistente IA</span><span class="nav-label">IA</span>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="theme-toggle" id="theme-toggle" title="Cambiar tema">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></svg>
      </div>
      <div class="avatar-btn" id="user-avatar" title="Cerrar sesión">--</div>
    </div>
  </nav>

  <main class="main">
    <section class="view" id="view-home"></section>
    <section class="view" id="view-trabajo"></section>
    <section class="view" id="view-finanzas"></section>
    <section class="view" id="view-personal"></section>
    <section class="view" id="view-productividad"></section>
    <section class="view" id="view-conocimiento"></section>
    <section class="view" id="view-ia"></section>
  </main>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
